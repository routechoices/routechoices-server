{% load hosts static %}
<header class="navbar navbar-expand-lg navbar-dark bg-primary"
        style="color: #fff;
               background-color: #111 !important">
    <div class="container">
        <a class="navbar-brand site-name d-inline-flex logo"
           href="{% host_url 'site:landing_page' host 'www' %}" style="margin-top:5px;">
            <div class="d-inline-block">
                <img src="{% static 'img/logo.svg' %}{{ engine_version_static_cache_buster }}"
                     alt="Site logo"
                     height="33"
                     style="vertical-align: top">
            </div>
            <div class="px-2">
                <div style="font-size:.85em;line-height: 1em;text-align: left;">ROUTECHOICES</div>
                <div style="font-size:.85em;line-height: 1em;">GPS TRACKING</div>
            </div>
        </a>
        <button id="navbar-toogler"
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav1"
                aria-controls="navbarNav1"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav1">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
            <ul class="navbar-nav d-flex flex-start">
                <li class="nav-item">
                    <a class="text-nowrap nav-link text-nowrap"
                       href="{% host_url 'site:landing_page' host 'www' %}"><i class="fa-solid fa-globe"></i> Site</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.resolver_match.view_name == 'contact_view' %} active{% endif %} text-nowrap"
                       href="{% host_url 'contact_view' host 'dashboard' %}"><i class="fa-solid fa-envelope"></i> Contact us</a>
                </li>
                {% if request.user.authenticated %}
                <li class="nav-item">
                    <div class="dropdown me-2">
                    <button class="nav-link btn dropdown-toggle" type="button" id="accountMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-circle-user"></i>&nbsp;Account
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="accountMenuBtn">
                        <li><a class="dropdown-item" href="{% url 'account_edit_view' %}"><i class="fa-solid fa-user"></i> Your Details</a></li>
                        <li><a class="dropdown-item" href="{% url 'account_email_list' %}"><i class="fa-solid fa-envelope"></i> Email Addresses</a></li>
                        <li><a class="dropdown-item" href="{% url 'account_password_change_view' %}"><i class="fa-solid fa-key"></i> Password</a></li>
                        <li><a class="dropdown-item" href="{% url 'kagi:two-factor-settings' %}"><i class="fa-solid fa-shield-halved"></i> Two-Factor Authentication</a></li>
                        <li><a class="dropdown-item" href="{% url 'account_session:list_view' %}"><i class="fa-regular fa-window-restore"></i> Sessions</a></li>
                        <li><a class="dropdown-item text-danger" href="{% host_url 'account_logout' host 'dashboard' %}"><span>Logout</span> <i class="fa-solid fa-arrow-right-from-bracket"></i></a></li>
                    </ul>
                </div>
                {% endif %}
            </li>
            </ul>
            <div class="vr if-navbar-not-toggled"></div>
            <hr class="if-navbar-toggled mt-0 mb-2" />
            <ul class="navbar-nav d-flex">
                <span class="if-not-collapsed me-2"></span>
                <li class="nav-item">
                    <a href="{% host_url 'account_login' host 'dashboard' %}" class="text-nowrap btn btn-primary navbar-btn loginBtn mt-0 me-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <button class="theme-selector" type="button" data-bs-toggle="tooltip">
                        <svg aria-hidden="true" class="theme-selector-icon">
                            <use xlink:href="#icon-auto"></use>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</header>
